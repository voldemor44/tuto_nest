version: '3.8'
services:
  nest-test-app-db:
    image: postgres:13
    ports:
      - 5434:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: orion
      POSTGRES_DB: nest-test-db
    networks:
      - nest-test-network

  nest-test-test-db:
    image: postgres:13
    ports:
      - 5435:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: orion
      POSTGRES_DB: nest-test-db
    networks:
      - nest-test-network

networks:
  nest-test-network:
